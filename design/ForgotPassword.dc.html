<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.nt{--bg:#FBFBFA;--surface:#FFFFFF;--subtle:#F7F7F5;--subtle2:#FCFCFB;--border:#E9E9E7;--border-strong:#E1E1DE;--control:#C9C9C5;--divider:#F0F0EE;--track:#EDEDEB;--text:#1F1F1E;--text2:#4A4A47;--muted:#6B6B68;--faint:#8A8A86;--accent:#5E5CE6;--accent-hover:#8E8CF0;--accent-text:#3E3CC0;--accent-soft:#EEEEFD;--accent-tint:#E4E3FB;--inverse:#1F1F1E;--inverse-text:#FFFFFF;--pill:#F1F1EF;--ok-bg:#E7F6EC;--ok-text:#1E6B3A;--ok-strong:#1E8A4C;--ok-border:#B7E4C7;--warn-bg:#FEF0C7;--warn-text:#93370D;--danger-bg:#FEF3F2;--danger-border:#FDD3CF;--danger-soft:#FEE4E2;--danger-text:#B42318;--danger-strong:#7A1A12;--danger-body:#8F2A20;--h0:#F1F1EF;--h1:#DCDBFA;--h2:#B9B8F4;--h3:#8E8CF0;--h4:#4F4DD6;--shadow:0 1px 2px rgba(0,0,0,0.06);color-scheme:light;transition:background-color 200ms ease,color 200ms ease}
.nt[data-theme="dark"]{--bg:#111113;--surface:#19191C;--subtle:#151518;--subtle2:#1C1C20;--border:#2A2A30;--border-strong:#34343B;--control:#4A4A52;--divider:#24242A;--track:#2A2A30;--text:#EDEDEC;--text2:#C4C4C8;--muted:#A1A1A6;--faint:#8E8E93;--accent:#5E5CE6;--accent-hover:#7C7AF0;--accent-text:#B9B8F4;--accent-soft:#26254A;--accent-tint:#2E2D5C;--inverse:#EDEDEC;--inverse-text:#131316;--pill:#26262C;--ok-bg:#10301F;--ok-text:#6EE7B7;--ok-strong:#34D399;--ok-border:#1F5A3E;--warn-bg:#3A2A0E;--warn-text:#FDB022;--danger-bg:#2A1514;--danger-border:#5A2420;--danger-soft:#3A1715;--danger-text:#F97066;--danger-strong:#FCA5A0;--danger-body:#F4B4AE;--h0:#24242A;--h1:#2E2D5C;--h2:#4341A0;--h3:#6563E0;--h4:#9C9AF5;--shadow:0 1px 2px rgba(0,0,0,0.5);color-scheme:dark}
.nt a{color:var(--accent-text)}
.nt input:focus-visible,.nt button:focus-visible,.nt a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="nt" data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; padding: 24px clamp(16px, 4vw, 48px); box-sizing: border-box">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: var(--inverse); color: var(--inverse-text); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">N</div>
      <span style="font-weight: 600; font-size: 15px">Notion Toolkit</span>
    </div>
    <button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </sc-if>
    </button>
  </header>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0">
    <div style="width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px clamp(20px, 4vw, 32px); box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; box-shadow: var(--shadow)">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </span>

      <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 22px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <h1 style="margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em">Forgot your password?</h1>
            <p style="margin: 0; color: var(--muted); line-height: 1.5">Enter the email you signed up with and we'll send a link to reset it.</p>
          </div>
          <form onSubmit="{{submit}}" novalidate style="display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="fp-email" style="font-size: 13px; font-weight: 500">Email</label>
              <input id="fp-email" type="email" autocomplete="email" value="{{email}}" onChange="{{setEmail}}" placeholder="you@example.com" style="{{emailStyle}}">
              <sc-if value="{{emailErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 12.5px; color: var(--danger-text)">{{emailErr}}</span></sc-if>
            </div>
            <button type="submit" style="{{btnStyle}}">{{btnLabel}}</button>
          </form>
        </div>
      </sc-if>

      <sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; gap: 14px">
          <h1 style="margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em">Check your inbox</h1>
          <p style="margin: 0; color: var(--muted); line-height: 1.5">We sent a reset link to <span style="color: var(--text); font-weight: 600">{{email}}</span>. It expires in 30 minutes.</p>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted)">
            Didn't get it?
            <button onClick="{{resend}}" style="border: 0; background: transparent; padding: 0; font: inherit; font-weight: 600; color: var(--accent-text); cursor: pointer">{{resendLabel}}</button>
          </div>
        </div>
      </sc-if>

      <a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border-radius: 9px; border: 1px solid var(--border-strong); color: var(--text); text-decoration: none; font-weight: 500; box-sizing: border-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
        Back to log in
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var th = props.theme || 'light';
    try { th = localStorage.getItem('nt-theme') || th; } catch (e) {}
    this.state = { theme: th, email: '', err: '', status: 'idle', resent: false };
  }
  componentDidMount() {
    var self = this;
    this.onStore = function (e) { if (e.key === 'nt-theme' && e.newValue) self.setState({ theme: e.newValue }); };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setState({ theme: this.props.theme }); }
  renderVals() {
    var self = this;
    var s = this.state;
    var dark = s.theme === 'dark';
    return {
      theme: s.theme, isDark: dark, isLight: !dark,
      themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: function () { var t = self.state.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('nt-theme', t); } catch (e) {} self.setState({ theme: t }); },
      email: s.email,
      setEmail: function (e) { self.setState({ email: e.target.value, err: '' }); },
      emailErr: s.err,
      emailStyle: 'height: 44px; padding: 0 12px; border-radius: 9px; font: inherit; color: var(--text); background: var(--surface); box-sizing: border-box; outline: 0; border: 1px solid ' + (s.err ? 'var(--danger-text)' : 'var(--border-strong)') + ';',
      notSent: s.status !== 'sent', isSent: s.status === 'sent',
      btnLabel: s.status === 'loading' ? 'Sending…' : 'Send reset link',
      btnStyle: 'height: 44px; border-radius: 9px; border: 0; font: inherit; font-weight: 600; font-size: 14.5px; color: #FFFFFF; cursor: pointer; background: ' + (s.status === 'loading' ? 'var(--accent-hover)' : 'var(--accent)') + ';',
      resendLabel: s.resent ? 'Sent again ✓' : 'Resend email',
      resend: function () { self.setState({ resent: true }); },
      submit: function (e) {
        e.preventDefault();
        if (!/^\S+@\S+\.\S+$/.test(self.state.email.trim())) { self.setState({ err: 'Enter a valid email address.' }); return; }
        self.setState({ status: 'loading' });
        setTimeout(function () { self.setState({ status: 'sent' }); }, 700);
      }
    };
  }
}
</script>
</body>
</html>
